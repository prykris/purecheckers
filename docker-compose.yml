# Local PostgreSQL for development and tests. Production uses Railway Postgres.
services:
  postgres:
    image: postgres:16-alpine
    container_name: purecheckers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkers
    ports:
      - "5432:5432"
    volumes:
      - purecheckers-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  purecheckers-pgdata:
